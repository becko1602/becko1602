</style><rect width="1200" height="78" rx="20" fill="#050709"/><rect x="1" y="1" width="1198" height="76" rx="20" fill="none" stroke="url(#rgb)" stroke-opacity=".8"/><text x="32" y="45" font-size="18" class="accent" >$ becko --identity</text><style>@keyframes role0{0%,100%{opacity:0}0.01%,19.99%{opacity:1}}</style><text x="340" y="45" font-size="21" class="" style="opacity:1;animation:role0 25s linear infinite">Full-Stack Developer</text><style>@keyframes role1{0%,100%{opacity:0}20.01%,39.99%{opacity:1}}</style><text x="340" y="45" font-size="21" class="" style="opacity:0;animation:role1 25s linear infinite">AI &amp; Automation Builder</text><style>@keyframes role2{0%,100%{opacity:0}40.01%,59.99%{opacity:1}}</style><text x="340" y="45" font-size="21" class="" style="opacity:0;animation:role2 25s linear infinite">Linux Enthusiast</text><style>@keyframes role3{0%,100%{opacity:0}60.01%,79.99%{opacity:1}}</style><text x="340" y="45" font-size="21" class="" style="opacity:0;animation:role3 25s linear infinite">Hackathon Participant</text><style>@keyframes role4{0%,100%{opacity:0}80.01%,99.99%{opacity:1}}</style><text x="340" y="45" font-size="21" class="" style="opacity:0;animation:role4 25s linear infinite">Future Computer Engineer</text></svg>