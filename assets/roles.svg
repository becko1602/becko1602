<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 78" role="img"><title>Full-stack · AI · Linux · Hackathons · Computer Engineering</title><desc>Full-stack · AI · Linux · Hackathons · Computer Engineering</desc><defs><linearGradient id="rgb"><stop class="s0"/><stop offset=".5" class="s1"/><stop offset="1" class="s2"/></linearGradient><linearGradient id="shine"><stop stop-color="#A7CABB" stop-opacity="0"/><stop offset=".5" stop-color="#A7CABB" stop-opacity=".7"/><stop offset="1" stop-color="#A7CABB" stop-opacity="0"/></linearGradient><radialGradient id="glow"><stop stop-color="#173D31" stop-opacity=".45"/><stop offset="1" stop-color="#050709" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#EDF1F5}.mono{font-family:monospace;fill:#8795A8}.accent{fill:#70A18C}.muted{fill:#9CA9B9}.s0{stop-color:#25634B}.s1{stop-color:#294E85}.s2{stop-color:#653F8F}.snake{stroke:#397E65}.logo{fill:#80B5A0}
