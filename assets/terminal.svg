<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img"><title>Arch Linux terminal introduction</title><desc>Arch Linux terminal introduction</desc><defs><linearGradient id="rgb"><stop stop-color="#FF1744"/><stop offset=".65" stop-color="#00BFFF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><radialGradient id="glow"><stop stop-color="#B90027" stop-opacity=".22"/><stop offset="1" stop-color="#050507" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#F8FAFC} .mono{font-family:monospace;fill:#94A3B8} .red{fill:#FF1744} .blue{fill:#00BFFF} .muted{fill:#94A3B8} @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}} @keyframes energy{to{stroke-dashoffset:-160}} @keyframes reveal{0%,8%{opacity:.08}35%,75%{opacity:1}82%{opacity:.7}88%{opacity:1}100%{opacity:.08}} @keyframes trace{0%,28%{stroke-dashoffset:1;opacity:0}32%{opacity:1}76%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}} @keyframes consume{0%,20%{opacity:1}26%,100%{opacity:0}} @keyframes snake{0%{offset-distance:0%;opacity:0}5%{opacity:1}87%{opacity:1}95%,100%{offset-distance:100%;opacity:0}} @keyframes type{0%,8%{opacity:0}12%,80%{opacity:1}100%{opacity:0}} @media(prefers-reduced-motion:reduce){*{animation:none!important;offset-distance:100%}.trail{stroke-dashoffset:0!important;opacity:1!important}}</style><rect width="1200" height="360" rx="20" fill="#050507"/><rect x="1" y="1" width="1198" height="358" rx="20" fill="none" stroke="url(#rgb)" stroke-opacity=".5"/><rect x="24" y="24" width="1152" height="312" rx="16" fill="#0B1020" stroke="#202A3C"/><text x="48" y="58" font-size="16" class="mono" >becko@arch ~ / terminal</text><style>@keyframes cmd0{0%{clip-path:inset(0 100% 0 0)}8%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}</style><g style="animation:cmd0 18s steps(24,end) infinite"><text x="48" y="96" font-size="17" class="red" >❯ whoami</text><text x="70" y="117" font-size="17" class="muted" >Behruzbek Bekchanov / Uzbekistan</text></g><style>@keyframes cmd1{0%{clip-path:inset(0 100% 0 0)}16%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}</style><g style="animation:cmd1 18s steps(24,end) infinite"><text x="48" y="142" font-size="17" class="red" >❯ cat interests.txt</text><text x="70" y="163" font-size="17" class="muted" >Full-stack · AI · Cybersecurity · Computer Engineering</text></g><style>@keyframes cmd2{0%{clip-path:inset(0 100% 0 0)}24%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}</style><g style="animation:cmd2 18s steps(24,end) infinite"><text x="48" y="188" font-size="17" class="red" >❯ ls ~/projects</text><text x="70" y="209" font-size="17" class="muted" >eDoska/  Becko/  becko-arch-linux/</text></g><style>@keyframes cmd3{0%{clip-path:inset(0 100% 0 0)}32%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}</style><g style="animation:cmd3 18s steps(24,end) infinite"><text x="48" y="234" font-size="17" class="red" >❯ echo $MISSION</text><text x="70" y="255" font-size="17" class="muted" >Build impactful products and opportunities in Uzbekistan.</text></g><style>@keyframes cmd4{0%{clip-path:inset(0 100% 0 0)}40%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}</style><g style="animation:cmd4 18s steps(24,end) infinite"><text x="48" y="280" font-size="17" class="red" >❯ neofetch</text><text x="70" y="301" font-size="17" class="muted" >Arch Linux / Hyprland / terminal-driven workflow</text></g><rect x="1040" y="294" width="10" height="20" fill="#FF1744" style="animation:pulse 3s infinite"/></svg>