<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img"><title>BECKO — Behruzbek Bekchanov</title><desc>Angular custom BECKO lettering, cyan circuits, ultraviolet and hot pink on midnight black. No snake.</desc><defs><linearGradient id="rgb"><stop class="s0"/><stop offset=".5" class="s1"/><stop offset="1" class="s2"/></linearGradient><linearGradient id="shine"><stop stop-color="#A7CABB" stop-opacity="0"/><stop offset=".5" stop-color="#A7CABB" stop-opacity=".7"/><stop offset="1" stop-color="#A7CABB" stop-opacity="0"/></linearGradient><radialGradient id="glow"><stop stop-color="#173D31" stop-opacity=".45"/><stop offset="1" stop-color="#090B16" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#EDF1F5}.mono{font-family:monospace;fill:#8795A8}.accent{fill:#35E8EF}.muted{fill:#9CA9B9}.s0{stop-color:#00D9E8}.s1{stop-color:#6957FF}.s2{stop-color:#F34EC4}.snake{stroke:#397E65}.logo{fill:#35E8EF}
@keyframes hue0{0%,100%{stop-color:#00D9E8}33%{stop-color:#6957FF}66%{stop-color:#F34EC4}}
@keyframes hue1{0%,100%{stop-color:#6957FF}33%{stop-color:#F34EC4}66%{stop-color:#00D9E8}}
@keyframes hue2{0%,100%{stop-color:#F34EC4}33%{stop-color:#00D9E8}66%{stop-color:#6957FF}}
@keyframes accent{0%,100%{fill:#35E8EF}33%{fill:#7899C8}66%{fill:#AA8AC7}}
@keyframes snakeColor{0%,100%{stroke:#397E65}33%{stroke:#3C629C}66%{stroke:#7852A0}}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes scan{0%,10%{transform:translateX(-1200px)}85%,100%{transform:translateX(1200px)}}
@keyframes energy{to{stroke-dashoffset:-180}}
@keyframes travel{0%{stroke-dashoffset:65;opacity:0}3%{opacity:1}94%{opacity:1}100%{stroke-dashoffset:-1000;opacity:0}}
@keyframes draw{0%,25%{stroke-dashoffset:1;opacity:0}32%{opacity:.9}78%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes apple{0%,24%{opacity:1}30%,100%{opacity:0}}
.s0{animation:hue0 24s ease-in-out infinite}.s1{animation:hue1 24s ease-in-out infinite}.s2{animation:hue2 24s ease-in-out infinite}
.accent,.logo{animation:accent 24s ease-in-out infinite}.snake{animation:snakeColor 24s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.beam{display:none}.trail{stroke-dashoffset:0!important;opacity:1!important}}
</style><rect width="1200" height="420" rx="20" fill="#090B16"/><rect x="1" y="1" width="1198" height="418" rx="20" fill="none" stroke="url(#rgb)" stroke-opacity=".8"/><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8790FF" stroke-opacity=".07"/></pattern></defs><rect width="1200" height="420" fill="url(#grid)"/><path d="M0 365H730L790 305H1200M0 372H730L790 312H1200" fill="none" stroke="#F34EC4" opacity=".4"/><text x="42" y="45" font-size="15" class="mono" >BECKO / PERSONAL INTERFACE</text><text x="1155" y="45" font-size="15" class="accent" text-anchor="end">UZB · 1602</text><g transform="translate(44 100) scale(1.48)" fill="#F2F4FF"><path d="M0 0H60L80 20V43L69 54L80 65V88L60 108H0Z M24 22V43H51L57 37V28L51 22Z M24 65V86H51L57 80V71L51 65Z" transform="translate(0 0)" fill-rule="evenodd"/><path d="M0 0H80V23H25V42H68V65H25V85H80V108H0Z" transform="translate(105 0)" fill-rule="evenodd"/><path d="M20 0H80V25H30L25 30V78L30 83H80V108H20L0 88V20Z" transform="translate(210 0)" fill-rule="evenodd"/><path d="M0 0H25V43L60 0H88L45 53L88 108H58L25 67V108H0Z" transform="translate(315 0)" fill-rule="evenodd"/><path d="M20 0H64L84 20V88L64 108H20L0 88V20Z M29 24L24 29V79L29 84H55L60 79V29L55 24Z" transform="translate(420 0)" fill-rule="evenodd"/></g><path d="M44 282H206L221 267H815" fill="none" stroke="#35E8EF" stroke-width="3"/><text x="44" y="328" font-size="25" class="" font-weight="700" letter-spacing="4">BEHRUZBEK BEKCHANOV</text><text x="44" y="365" font-size="18" class="accent" >FULL-STACK DEVELOPER  /  AI &amp; AUTOMATION  /  LINUX</text><path d="M1000 115L1128 115V243H1000Z M1024 139H1104V219H1024Z" fill="none" stroke="#6957FF" stroke-width="2"/><path d="M984 99V75H1010M1144 99V75H1118M984 259V283H1010M1144 259V283H1118" fill="none" stroke="#F34EC4" stroke-width="3"/><text x="1064" y="191" font-size="39" class="accent" text-anchor="middle">&lt;/&gt;</text><text x="1064" y="319" font-size="12" class="mono" text-anchor="middle">BUILD / SHIP / REPEAT</text></svg>