<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 575" role="img"><title>My journey to KAIST — personal goals, not admission claims</title><desc>My journey to KAIST — personal goals, not admission claims</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#F8FAFC}.mono{font-family:monospace;fill:#94A3B8}.red{fill:#FF1744}.blue{fill:#00BFFF}.muted{fill:#94A3B8}</style><defs><linearGradient id="rgb"><stop stop-color="#FF1744"/><stop offset=".65" stop-color="#00BFFF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><radialGradient id="glow"><stop stop-color="#B90027" stop-opacity=".22"/><stop offset="1" stop-color="#050507" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="575" rx="20" fill="#050507"/><rect x="1" y="1" width="1198" height="573" rx="20" fill="none" stroke="url(#rgb)" stroke-opacity=".5"/><text x="32" y="40" font-size="23" class="red" >KAIST // FUTURE DESTINATION</text><text x="32" y="79" font-size="23" class="" >Building today what I hope will shape tomorrow.</text><circle cx="48" cy="119" r="7" fill="#050507" stroke="#FF1744"/><text x="74" y="124" font-size="21" class="muted" >01  Strengthen academic profile</text><path d="M48 128v26" stroke="#263249"/><circle cx="48" cy="163" r="7" fill="#050507" stroke="#FF1744"/><text x="74" y="168" font-size="21" class="muted" >02  Build competitive English proficiency</text><path d="M48 172v26" stroke="#263249"/><circle cx="48" cy="207" r="7" fill="#050507" stroke="#FF1744"/><text x="74" y="212" font-size="21" class="muted" >03  Prepare for SAT / target 1500+</text><path d="M48 216v26" stroke="#263249"/><circle cx="48" cy="251" r="7" fill="#050507" stroke="#FF1744"/><text x="74" y="256" font-size="21" class="muted" >04  Develop meaningful technical projects</text><path d="M48 260v26" stroke="#263249"/><circle cx="48" cy="295" r="7" fill="#050507" stroke="#00BFFF"/><text x="74" y="300" font-size="21" class="muted" >05  Document hackathons and olympiads</text><path d="M48 304v26" stroke="#263249"/><circle cx="48" cy="339" r="7" fill="#050507" stroke="#00BFFF"/><text x="74" y="344" font-size="21" class="muted" >06  Prepare recommendation letters</text><path d="M48 348v26" stroke="#263249"/><circle cx="48" cy="383" r="7" fill="#050507" stroke="#00BFFF"/><text x="74" y="388" font-size="21" class="muted" >07  Write application essays</text><path d="M48 392v26" stroke="#263249"/><circle cx="48" cy="427" r="7" fill="#050507" stroke="#00BFFF"/><text x="74" y="432" font-size="21" class="muted" >08  Review official admission requirements</text><path d="M48 436v26" stroke="#263249"/><circle cx="48" cy="471" r="7" fill="#050507" stroke="#00BFFF"/><text x="74" y="476" font-size="21" class="muted" >09  Submit a competitive application</text><text x="32" y="548" font-size="15" class="mono" >PERSONAL ROADMAP / goals, not completed milestones or an admission offer</text></svg>