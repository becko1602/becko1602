<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 132" role="img"><title>Developer quote — Linus Torvalds</title><desc>Developer quote — Linus Torvalds</desc><defs><linearGradient id="rgb"><stop class="s0"/><stop offset=".5" class="s1"/><stop offset="1" class="s2"/></linearGradient><linearGradient id="shine"><stop stop-color="#A7CABB" stop-opacity="0"/><stop offset=".5" stop-color="#A7CABB" stop-opacity=".7"/><stop offset="1" stop-color="#A7CABB" stop-opacity="0"/></linearGradient><radialGradient id="glow"><stop stop-color="#173D31" stop-opacity=".45"/><stop offset="1" stop-color="#090B16" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#EDF1F5}.mono{font-family:monospace;fill:#8795A8}.accent{fill:#35E8EF}.muted{fill:#9CA9B9}.s0{stop-color:#00D9E8}.s1{stop-color:#6957FF}.s2{stop-color:#F34EC4}.snake{stroke:#397E65}.logo{fill:#35E8EF}</style><rect width="1200" height="132" rx="20" fill="#090B16"/><rect x="1" y="1" width="1198" height="130" rx="20" fill="none" stroke="url(#rgb)" stroke-opacity=".8"/><text x="36" y="56" font-size="30" class="accent" >“Talk is cheap. Show me the code.”</text><text x="1164" y="101" font-size="19" class="muted" text-anchor="end">— Linus Torvalds</text></svg>