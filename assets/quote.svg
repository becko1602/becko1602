</style><rect width="1200" height="132" rx="12" fill="#050807"/><rect x="1" y="1" width="1198" height="130" rx="12" fill="none" stroke="#24332B"/><text x="36" y="56" font-size="30" class="accent" >“Talk is cheap. Show me the code.”</text><text x="1164" y="101" font-size="19" class="muted" text-anchor="end">— Linus Torvalds</text></svg>