<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 132" role="img"><title>Developer quote — Linus Torvalds</title><desc>Developer quote — Linus Torvalds</desc><defs><linearGradient id="rgb"><stop class="s0"/><stop offset=".5" class="s1"/><stop offset="1" class="s2"/></linearGradient><linearGradient id="shine"><stop stop-color="#A7CABB" stop-opacity="0"/><stop offset=".5" stop-color="#A7CABB" stop-opacity=".7"/><stop offset="1" stop-color="#A7CABB" stop-opacity="0"/></linearGradient><radialGradient id="glow"><stop stop-color="#173D31" stop-opacity=".45"/><stop offset="1" stop-color="#090B16" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#E6EDF3}.mono{font-family:"JetBrains Mono","Fira Code",monospace;fill:#8B949E}.accent{fill:#00FF41}.muted{fill:#8B949E}.s0,.s1,.s2{stop-color:#24332B}.snake{stroke:#00C853}.logo{fill:#00C853}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
