<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" role="img"><title>Connect on GitHub</title><desc>Connect on GitHub</desc><defs><linearGradient id="rgb"><stop stop-color="#FF1744"/><stop offset=".65" stop-color="#00BFFF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><radialGradient id="glow"><stop stop-color="#B90027" stop-opacity=".22"/><stop offset="1" stop-color="#050507" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#F8FAFC} .mono{font-family:monospace;fill:#94A3B8} .red{fill:#FF1744} .blue{fill:#00BFFF} .muted{fill:#94A3B8} @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}} @keyframes energy{to{stroke-dashoffset:-160}} @keyframes reveal{0%,8%{opacity:.08}35%,75%{opacity:1}82%{opacity:.7}88%{opacity:1}100%{opacity:.08}} @keyframes trace{0%,28%{stroke-dashoffset:1;opacity:0}32%{opacity:1}76%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}} @keyframes consume{0%,20%{opacity:1}26%,100%{opacity:0}} @keyframes snake{0%{offset-distance:0%;opacity:0}5%{opacity:1}87%{opacity:1}95%,100%{offset-distance:100%;opacity:0}} @keyframes type{0%,8%{opacity:0}12%,80%{opacity:1}100%{opacity:0}} @media(prefers-reduced-motion:reduce){*{animation:none!important;offset-distance:100%}.trail{stroke-dashoffset:0!important;opacity:1!important}}</style><rect width="240" height="70" rx="20" fill="#050507"/><rect x="1" y="1" width="238" height="68" rx="20" fill="none" stroke="url(#rgb)" stroke-opacity=".5"/><rect x="1" y="1" width="238" height="68" rx="16" fill="#0B1020" stroke="#202A3C"/><text x="16" y="44" font-size="21" class="red" >GH</text><text x="66" y="44" font-size="22" class="" >GitHub</text></svg>