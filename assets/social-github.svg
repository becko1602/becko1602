<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" role="img"><title>Connect on GitHub</title><desc>Connect on GitHub</desc><defs><linearGradient id="rgb"><stop class="s0"/><stop offset=".5" class="s1"/><stop offset="1" class="s2"/></linearGradient><linearGradient id="shine"><stop stop-color="#A7CABB" stop-opacity="0"/><stop offset=".5" stop-color="#A7CABB" stop-opacity=".7"/><stop offset="1" stop-color="#A7CABB" stop-opacity="0"/></linearGradient><radialGradient id="glow"><stop stop-color="#173D31" stop-opacity=".45"/><stop offset="1" stop-color="#090B16" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#EDF1F5}.mono{font-family:monospace;fill:#8795A8}.accent{fill:#35E8EF}.muted{fill:#9CA9B9}.s0{stop-color:#00D9E8}.s1{stop-color:#6957FF}.s2{stop-color:#F34EC4}.snake{stroke:#397E65}.logo{fill:#35E8EF}
@keyframes hue0{0%,100%{stop-color:#00D9E8}33%{stop-color:#6957FF}66%{stop-color:#F34EC4}}
@keyframes hue1{0%,100%{stop-color:#6957FF}33%{stop-color:#F34EC4}66%{stop-color:#00D9E8}}
