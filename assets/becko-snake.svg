<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 235" role="img"><title>Decorative BECKO snake</title><desc>Decorative BECKO snake</desc><defs><linearGradient id="rgb"><stop class="s0"/><stop offset=".5" class="s1"/><stop offset="1" class="s2"/></linearGradient><linearGradient id="shine"><stop stop-color="#A7CABB" stop-opacity="0"/><stop offset=".5" stop-color="#A7CABB" stop-opacity=".7"/><stop offset="1" stop-color="#A7CABB" stop-opacity="0"/></linearGradient><radialGradient id="glow"><stop stop-color="#173D31" stop-opacity=".45"/><stop offset="1" stop-color="#050709" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#EDF1F5}.mono{font-family:monospace;fill:#8795A8}.accent{fill:#70A18C}.muted{fill:#9CA9B9}.s0{stop-color:#25634B}.s1{stop-color:#294E85}.s2{stop-color:#653F8F}.snake{stroke:#397E65}.logo{fill:#80B5A0}
@keyframes hue0{0%,100%{stop-color:#25634B}33%{stop-color:#294E85}66%{stop-color:#653F8F}}
@keyframes hue1{0%,100%{stop-color:#294E85}33%{stop-color:#653F8F}66%{stop-color:#25634B}}
@keyframes hue2{0%,100%{stop-color:#653F8F}33%{stop-color:#25634B}66%{stop-color:#294E85}}
@keyframes accent{0%,100%{fill:#70A18C}33%{fill:#7899C8}66%{fill:#AA8AC7}}
@keyframes snakeColor{0%,100%{stroke:#397E65}33%{stroke:#3C629C}66%{stroke:#7852A0}}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes scan{0%,10%{transform:translateX(-1200px)}85%,100%{transform:translateX(1200px)}}
@keyframes energy{to{stroke-dashoffset:-180}}
@keyframes travel{0%{stroke-dashoffset:65;opacity:0}3%{opacity:1}94%{opacity:1}100%{stroke-dashoffset:-1000;opacity:0}}
@keyframes draw{0%,25%{stroke-dashoffset:1;opacity:0}32%{opacity:.9}78%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes apple{0%,24%{opacity:1}30%,100%{opacity:0}}
.s0{animation:hue0 24s ease-in-out infinite}.s1{animation:hue1 24s ease-in-out infinite}.s2{animation:hue2 24s ease-in-out infinite}
.accent,.logo{animation:accent 24s ease-in-out infinite}.snake{animation:snakeColor 24s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.beam{display:none}.trail{stroke-dashoffset:0!important;opacity:1!important}}
</style><rect width="1200" height="235" rx="20" fill="#050709"/><rect x="1" y="1" width="1198" height="233" rx="20" fill="none" stroke="url(#rgb)" stroke-opacity=".8"/><text x="32" y="36" font-size="15" class="mono" >BECKO / SIGNAL IN MOTION</text><g transform="translate(350 182) scale(1.5)"><path d="M0 0V-50H25Q45 -50 45 -37Q45 -25 25 -25H0H28Q48 -25 48 -12Q48 0 28 0Z M72 0V-50H115 M72 -25H108 M72 0H115 M185 -45Q140 -68 140 -25Q140 15 185 -5 M210 0V-50 M210 -25L250 -50 M210 -25L250 0 M280 -25Q280 -50 303 -50Q326 -50 326 -25Q326 0 303 0Q280 0 280 -25" fill="none" stroke="#182A31" stroke-width="7"/><path class="trail" d="M0 0V-50H25Q45 -50 45 -37Q45 -25 25 -25H0H28Q48 -25 48 -12Q48 0 28 0Z M72 0V-50H115 M72 -25H108 M72 0H115 M185 -45Q140 -68 140 -25Q140 15 185 -5 M210 0V-50 M210 -25L250 -50 M210 -25L250 0 M280 -25Q280 -50 303 -50Q326 -50 326 -25Q326 0 303 0Q280 0 280 -25" pathLength="1" fill="none" stroke="url(#rgb)" stroke-width="5" stroke-linecap="round" style="stroke-dasharray:1;stroke-dashoffset:0;animation:draw 18s ease-in-out infinite"/><g style="animation:apple 18s linear infinite"><path d="M-16 -77Q-18 -89 -8 -85Q4 -90 2 -77Q-1 -65 -8 -69Q-14 -66 -16 -77" fill="#5A906D"/><path d="M-8 -86Q-6 -96 2 -94" fill="none" stroke="#9ABD9D" stroke-width="3"/></g><path class="snake" d="M360 -105H40Q-8 -105 -8 -75Q-8 -55 30 -55H250Q305 -55 305 -25Q305 5 280 5" pathLength="1000" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="65 1100" stroke-dashoffset="-440" style="animation:travel 18s linear infinite,snakeColor 24s ease-in-out infinite"/></g></svg>