name: Update BECKO profile
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/update-profile.yml'
permissions:
  contents: read
concurrency:
  group: becko-profile
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'becko1602/becko1602'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate real-data artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_profile.py
      - name: Validate assets
        run: python3 scripts/validate.py
      - name: Commit changed generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets data/activity.json
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'Refresh authentic profile activity'
            git push
          fi
